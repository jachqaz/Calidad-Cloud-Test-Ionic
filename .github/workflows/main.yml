name: Ionic CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # =================================================================
  # QUALITY GATE - Validación inicial
  # =================================================================
  quality_gate:
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.build-info.outputs.build-number }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linting
        run: npm run lint

      - name: 🧪 Run Tests
        run: npm run test:ci

      - name: 📊 Generate Build Info
        id: build-info
        run: |
          BUILD_NUMBER="${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "build-number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Build Number: $BUILD_NUMBER"

  # =================================================================
  # BUILD WEB
  # =================================================================
  build_web:
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Build Web
        run: npm run build -- --configuration=production

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ needs.quality_gate.outputs.build-number }}
          path: www
          retention-days: 30

  # =================================================================
  # BUILD ANDROID
  # =================================================================
  build_android:
    needs: [ quality_gate, build_web ]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🗂️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ needs.quality_gate.outputs.build-number }}
          path: www

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔧 Clean Android Platform
        run: rm -rf android

      - name: 📱 Add Android Platform
        run: npx cap add android

      - name: 🏗️ Sync Capacitor
        run: npx cap sync android

      - name: 🛠️ Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel

      - name: 📤 Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.quality_gate.outputs.build-number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # =================================================================
  # BUILD iOS
  # =================================================================
  build_ios:
    needs: [ quality_gate, build_web ]
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🗂️ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ needs.quality_gate.outputs.build-number }}
          path: www

      - name: 📦 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔧 Clean iOS Platform
        run: rm -rf ios

      - name: 📱 Add iOS Platform
        run: npx cap add ios

      - name: 🏗️ Sync Capacitor
        run: npx cap sync ios

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: 🍎 Build iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App-${{ needs.quality_gate.outputs.build-number }}.xcarchive \
            archive

      - name: 📤 Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ needs.quality_gate.outputs.build-number }}
          path: ios/App/build/App-${{ needs.quality_gate.outputs.build-number }}.xcarchive
          retention-days: 30
