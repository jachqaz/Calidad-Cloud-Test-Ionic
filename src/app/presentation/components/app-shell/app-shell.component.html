<ion-split-pane contentId="main-content">
  <ion-menu contentId="main-content" type="overlay">
    <ion-content>
      <ion-list id="inbox-list">
        <ion-list-header>{{ i18n.t('home.title') }}</ion-list-header>

        <ion-menu-toggle *ngFor="let p of appPages(); trackBy: trackItems" auto-hide="false">
          <ion-item
            [routerLink]="[p.url]"
            detail="false"
            lines="none"
            routerDirection="root"
            routerLinkActive="selected">
            <ion-icon [name]="p.icon" aria-hidden="true" slot="start"></ion-icon>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-split-pane>
