<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ i18n.t('settings.title') }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="settings-content">
  <div class="container">
    <ion-list>
      <!-- Language Selection -->
      <ion-item>
        <ion-icon name="language-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ i18n.t('settings.language') }}</h2>
        </ion-label>
        <ion-select
          (ionChange)="changeLanguage($event.detail.value)"
          [value]="i18n.language()"
          interface="popover">
          <ion-select-option value="es">Español</ion-select-option>
          <ion-select-option value="en">English</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Genre Selection -->
      <ion-item (click)="openGenreSelection()" button>
        <ion-icon name="library-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ i18n.t('settings.change-genres') }}</h2>
          <p>{{ i18n.t('genre.title') }}</p>
        </ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>
    </ion-list>

    @if (currentGenres().length > 0) {
      <div class="current-genres">
        <h3>{{ i18n.t('settings.genres') }}:</h3>
        <div class="genre-chips">
          @for (genre of currentGenres(); track genre.id) {
            <ion-chip color="primary">
              <ion-label>{{ genre.name }}</ion-label>
            </ion-chip>
          }
        </div>
      </div>
    }
  </div>
</ion-content>
